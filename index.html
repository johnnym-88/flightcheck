<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FlightCheck — Know before you fly</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#1B4B66" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FlightCheck" />
<style>
  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --ink: #14171B;
    --ink-soft: #585F68;
    --ink-faint: #8A9099;
    --border: #E6E3DE;
    --border-soft: #EFEDE8;
    --brand: #1B4B66;
    --brand-dark: #123449;
    --brand-soft: #EAF1F4;
    --green: #157F3C;
    --green-bg: #E7F5EA;
    --green-border: #C4E6CE;
    --amber: #AD6F0A;
    --amber-bg: #FCF0DA;
    --amber-border: #EFD9A4;
    --red: #C13B2E;
    --red-bg: #FBEAE8;
    --red-border: #F0C7C1;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171B; --surface: #1C2024; --ink: #F2F1EE; --ink-soft: #A9AEB5; --ink-faint: #787E86;
      --border: #2C3136; --border-soft: #24282C; --brand: #6FA8C4; --brand-dark: #9CC5DA; --brand-soft: #1E333D;
      --green-bg: #163524; --amber-bg: #3A2E12; --red-bg: #3A1F1C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171B; --surface: #1C2024; --ink: #F2F1EE; --ink-soft: #A9AEB5; --ink-faint: #787E86;
    --border: #2C3136; --border-soft: #24282C; --brand: #6FA8C4; --brand-dark: #9CC5DA; --brand-soft: #1E333D;
    --green-bg: #163524; --amber-bg: #3A2E12; --red-bg: #3A1F1C;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border-soft);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .topbar { max-width: 900px; margin: 0 auto; padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .brand-btn { background: none; border: none; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; font-family: inherit; }
  nav.links { display: flex; gap: 20px; }
  nav.links button { background: none; border: none; font-size: 14px; color: var(--ink-soft); cursor: pointer; font-family: inherit; }

  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--brand); text-transform: uppercase; margin: 0 0 14px; }
  h1.headline { font-size: 40px; font-weight: 700; line-height: 1.15; margin: 0; }
  .sub { font-size: 17px; line-height: 1.55; color: var(--ink-soft); max-width: 520px; margin: 16px auto 0; }
  .hero { text-align: center; padding: 56px 0 36px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px; }
  .toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--brand-soft); border-radius: 12px; padding: 4px; }
  .toggle button { border: none; border-radius: 9px; padding: 11px 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 7px; color: var(--ink-soft); background: transparent; }
  .toggle button.active { background: var(--surface); color: var(--brand); box-shadow: 0 1px 2px rgba(20,23,27,0.08); }

  .field { margin-top: 16px; }
  .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .field input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 15px; background: var(--bg); color: var(--ink); font-family: inherit; }
  .field input:focus { outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
  .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }

  .cta { width: 100%; margin-top: 18px; background: var(--brand); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .cta:active { opacity: 0.9; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 1px solid var(--border); background: var(--bg); color: var(--ink-soft); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .chip-label { font-size: 12px; color: var(--ink-faint); margin-bottom: 8px; }
  .divider-top { border-top: 1px solid var(--border-soft); margin-top: 20px; padding-top: 20px; }

  .how { border-top: 1px solid var(--border-soft); padding: 48px 0; }
  .how h2 { text-align: center; font-size: 21px; margin: 0 0 30px; }
  .how-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  @media (max-width: 620px) { .how-grid { grid-template-columns: 1fr; text-align: center; } }
  .step-n { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; margin: 0 auto 12px; }
  @media (min-width: 621px) { .step-n { margin: 0 0 12px; } }
  .how-grid h3 { font-size: 14px; margin: 0 0 6px; }
  .how-grid p { font-size: 14px; color: var(--ink-soft); line-height: 1.5; margin: 0; }

  main { padding-bottom: 40px; }
  .back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--brand); font-size: 14px; font-weight: 500; cursor: pointer; padding: 20px 0 0; font-family: inherit; }

  .flight-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .flight-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
  .flight-airline { font-size: 13px; color: var(--ink-faint); font-weight: 400; }
  .direction-tag { font-size: 13px; font-weight: 500; color: var(--ink-soft); }
  .route { font-size: 21px; font-weight: 600; margin-top: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .route .arrow { color: var(--ink-faint); font-weight: 400; }
  .sched { margin-top: 10px; font-size: 13px; color: var(--ink-faint); }

  .score-card { text-align: center; padding: 34px 22px; }
  .score-num { font-size: 76px; font-weight: 700; line-height: 1; }
  .score-label { font-size: 16px; color: var(--ink-soft); margin-top: 10px; }
  .badge { display: inline-block; margin-top: 14px; padding: 5px 13px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.03em; }
  .interp { margin-top: 12px; font-size: 15px; color: var(--ink-soft); max-width: 340px; margin-left: auto; margin-right: auto; }
  .hist-label { font-size: 12px; color: var(--ink-faint); margin-bottom: 14px; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; border-top: 1px solid var(--border-soft); margin-top: 30px; padding-top: 22px; }
  .stat-v { font-size: 19px; font-weight: 600; }
  .stat-l { font-size: 11px; color: var(--ink-faint); margin-top: 3px; }

  .why-title { font-size: 15px; font-weight: 600; margin: 0 0 16px; }
  .why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 480px) { .why-grid { grid-template-columns: 1fr; } }
  .why-item { display: flex; gap: 11px; }
  .why-icon { width: 32px; height: 32px; border-radius: 9px; background: var(--brand-soft); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .why-t { font-size: 13.5px; font-weight: 500; }
  .why-d { font-size: 13.5px; color: var(--ink-soft); margin-top: 2px; }

  .tag-illustrative { font-size: 11px; background: var(--border-soft); color: var(--ink-faint); padding: 4px 10px; border-radius: 999px; }
  .timeline-row { display: flex; justify-content: space-between; margin-top: 26px; position: relative; }
  .timeline-row::before { content: ""; position: absolute; top: 15px; left: 0; right: 0; height: 1px; background: var(--border); }
  .tl-point { text-align: center; flex: 1; position: relative; }
  .tl-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; margin: 0 auto; position: relative; z-index: 1; border: 2px solid; }
  .tl-label { font-size: 10.5px; color: var(--ink-faint); margin-top: 8px; }

  .trust-box { background: var(--brand-soft); border-radius: 16px; padding: 18px; text-align: center; }
  .trust-box p { margin: 0; font-size: 13.5px; color: var(--brand-dark); }

  .not-found { text-align: center; padding: 70px 0; }
  .nf-icon { width: 46px; height: 46px; border-radius: 50%; background: var(--border-soft); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 20px; }

  .loading { text-align: center; padding: 90px 0; color: var(--ink-soft); font-size: 14px; }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; margin: 0 auto 14px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { border-top: 1px solid var(--border-soft); padding: 26px 0; text-align: center; }
  footer .fname { font-size: 14px; font-weight: 500; }
  footer .ftag { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }

  .card + .card { margin-top: 18px; }

  .admin-toggle { position: fixed; bottom: 14px; left: 14px; font-size: 11px; color: var(--ink-faint); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; cursor: pointer; opacity: 0.55; font-family: inherit; }
  .admin-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .admin-box { background: var(--surface); border-radius: 16px; padding: 22px; max-width: 480px; width: 100%; max-height: 80vh; overflow: auto; }
  .admin-box h3 { margin: 0 0 8px; font-size: 15px; }
  .admin-box p { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .admin-box textarea { width: 100%; height: 140px; font-family: monospace; font-size: 11px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink); }
  .admin-box .row { display: flex; gap: 8px; margin-top: 10px; }
  .admin-box button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); font-family: inherit; cursor: pointer; font-size: 13px; }
  .admin-box button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .admin-status { font-size: 12px; margin-top: 8px; }

  .mode-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .mode-toggle button { flex: 1; border: 1px solid var(--border); background: var(--bg); color: var(--ink-soft); border-radius: 10px; padding: 9px; font-size: 13.5px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .mode-toggle button.active { background: var(--brand); color: #fff; border-color: var(--brand); }

  .dest-section-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 22px 0 10px; }
  .dest-section-title:first-child { margin-top: 0; }
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
  .rank-row:hover { background: var(--bg); }
  .rank-row:last-child { border-bottom: none; }
  .rank-pos { width: 22px; font-size: 13px; color: var(--ink-faint); font-weight: 600; flex-shrink: 0; }
  .rank-mid { flex: 1; min-width: 0; }
  .rank-airline { font-size: 14px; font-weight: 500; }
  .rank-flight { font-size: 12px; color: var(--ink-faint); }
  .flight-num-highlight { color: var(--ink); font-weight: 600; }
  .info-dot { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: var(--border-soft); color: var(--ink-faint); font-size: 10px; font-weight: 700; cursor: pointer; vertical-align: middle; }
  .rank-pct { font-size: 17px; font-weight: 700; flex-shrink: 0; }
  .rank-badge-mini { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; }
  .dest-title-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .dest-hint { font-size: 12.5px; color: var(--ink-faint); margin-top: 4px; }
</style>
</head>
<body>
<header class="top">
  <div class="topbar">
    <button class="brand-btn" onclick="goHome()">FlightCheck</button>
    <nav class="links">
      <button onclick="goHome(); setTimeout(()=>document.getElementById('search-card')?.scrollIntoView({behavior:'smooth'}),50)">בדיקת טיסה</button>
      <button onclick="goHome(); setTimeout(()=>document.getElementById('how')?.scrollIntoView({behavior:'smooth'}),50)">איך זה עובד</button>
    </nav>
  </div>
</header>

<main>
  <div id="app" class="wrap"></div>
  <div id="flight-detail-modal" class="admin-panel" style="display:none" onclick="if(event.target===this) closeFlightDetail()">
    <div class="admin-box" id="flight-detail-content"></div>
  </div>
</main>

<footer>
  <div class="fname">FlightCheck</div>
  <div class="ftag">Know before you fly.</div>
</footer>



<script>
let SEED_DATA = [];
// Fill these in with your two n8n webhook Production URLs once created
// (see "FlightCheck - Submit Review" and "FlightCheck - Get Reviews" workflows).
const SUBMIT_REVIEW_URL = 'https://jomeital.app.n8n.cloud/webhook/submit-review';
const GET_REVIEWS_URL = 'https://jomeital.app.n8n.cloud/webhook/get-reviews';

let ALL_FLIGHTS = [];
let ROUTE_GROUPS = [];
let dataLoaded = false;
let dataLoadError = false;

// Common Hebrew destination-name -> English matching fragment, so users can
// type a city in Hebrew even though the underlying data uses English names.
// Not exhaustive: any city not listed here still works if typed in English
// (or in a form that appears literally in the data), via substring match.
const HEBREW_CITY_MAP = {
  "רומא": "rome", "אתונה": "athens", "לרנקה": "larnaca", "לארנקה": "larnaca",
  "פאפוס": "paphos", "בודפשט": "budapest", "פראג": "prague", "וינה": "vienna",
  "ורשה": "warsaw", "ברלין": "berlin", "מינכן": "munich", "פרנקפורט": "frankfurt",
  "פריז": "paris", "לונדון": "london", "מדריד": "madrid", "ברצלונה": "barcelona",
  "מילאנו": "milan", "רודוס": "rhodes", "היראקליון": "heraklion", "חניה": "khania",
  "סופיה": "sofia", "בוקרשט": "bucharest", "זאגרב": "zagreb", "בלגרד": "belgrade",
  "סרייבו": "sarajevo", "קרקוב": "krakow", "בטומי": "batumi", "טביליסי": "tbilisi",
  "באקו": "baku", "דובאי": "dubai", "אבו דאבי": "abu dhabi", "בנגקוק": "bangkok",
  "פוקט": "phuket", "טוקיו": "tokyo", "ניו יורק": "new york", "לוס אנגלס": "los angeles",
  "לוס אנג'לס": "los angeles", "מיאמי": "miami", "בוסטון": "boston", "ליסבון": "lisbon",
  "פורטו": "porto", "ציריך": "zurich", "ג'נבה": "geneva", "גינבה": "geneva",
  "בזל": "basel", "המבורג": "hamburg", "קלן": "cologne", "דיסלדורף": "dusseldorf",
  "מלגה": "malaga", "מרסיי": "marseille", "ניס": "nice", "ליון": "lyon",
  "ונציה": "venice", "נאפולי": "naples", "בולוניה": "bologna", "פלרמו": "palermo",
  "קטניה": "catania", "בארי": "bari", "ברגמו": "bergamo", "קופנהגן": "copenhagen",
  "אמסטרדם": "amsterdam", "בריסל": "brussels", "ריגה": "riga", "וילנה": "vilnius",
  "וילנוס": "vilnius", "מינסק": "minsk", "סלוניקי": "thessaloniki", "כורפו": "corfu",
  "סנטוריני": "santorini", "מיקונוס": "mikonos", "קוס": "kos", "בורגס": "burgas",
  "וארנה": "varna", "טירנה": "tirana", "ליובליאנה": "ljubljana", "טיוואט": "tivat",
  "דוברובניק": "dubrovnik", "מרקש": "marrakesh", "זנזיבר": "zanzibar",
  "אדיס אבבה": "addis ababa", "סיישל": "mahe seychelles", "טשקנט": "tashkent",
  "סמרקנד": "samarkand", "ירוואן": "yerevan", "קישינב": "chisinau",
  "מוסקבה": "moscow", "סוצ'י": "sochi", "קרסנודר": "krasnodar", "אילת": "ramon",
  "רמון": "ramon",
  // Previously unmapped cities (found via systematic audit - see conversation notes)
  "בקאו": "bacau", "ברטיסלבה": "bratislava", "סלובקיה": "bratislava",
  "קליארי": "cagliari", "קלוז'": "cluj napoca", "קלוז' נאפוקה": "cluj napoca",
  "יאסי": "iasi", "קלמטה": "kalamata", "קרפתוס": "karpathos",
  "קפלוניה": "kefallinia", "קילימנג'רו": "kilimanjaro", "לינץ": "linz",
  "לוטון": "luton", "מדיירה": "madeira", "לסבוס": "mitilini", "מיטיליני": "mitilini",
  "הנוי": "hanoi", "וייטנאם": "hanoi", "פרווזה": "preveza", "לפקדה": "preveza",
  "ז'שוב": "rzeszow", "זלצבורג": "salzburg", "סוצ'אבה": "suceava",
  "טטרה": "tatry", "ורונה": "verona",
  // Country-name shortcuts for countries we only serve one city in
  "אלבניה": "tirana", "ארמניה": "yerevan", "מולדובה": "chisinau",
  "בלארוס": "minsk", "אתיופיה": "addis ababa", "מונטנגרו": "tivat",
  "סלובניה": "ljubljana", "בוסניה": "sarajevo", "אזרבייג'ן": "baku",
  "לטביה": "riga", "ליטא": "vilnius",
};

function normalizeDestinationQuery(input) {
  const trimmed = input.trim();
  const mapped = HEBREW_CITY_MAP[trimmed] || HEBREW_CITY_MAP[trimmed.toLowerCase()];
  return (mapped || trimmed).toLowerCase();
}

let view = 'home';
let currentFlight = null;
let direction = 'departure';
let searchMode = 'number'; // 'number' | 'destination'
let destResults = null;
let destDirectionFilter = 'both';
let destQueryLabel = '';

function riskMeta(level) {
  if (level === 'low') return { label: 'LOW RISK', varFg: '--green', varBg: '--green-bg', varBorder: '--green-border' };
  if (level === 'medium') return { label: 'MEDIUM RISK', varFg: '--amber', varBg: '--amber-bg', varBorder: '--amber-border' };
  return { label: 'HIGH RISK', varFg: '--red', varBg: '--red-bg', varBorder: '--red-border' };
}
function riskInterpretation(level, dir) {
  const verb = dir === 'arrival' ? 'בנחיתה' : 'בהמראה';
  if (level === 'low') return 'לטיסה הזו יש היסטוריה של אמינות גבוהה יחסית.';
  if (level === 'medium') return 'לטיסה הזו יש סיכוי משמעותי לאיחור.';
  return `כדאי לקחת בחשבון סיכוי גבוה לאיחור ${verb}.`;
}

let META = null;

async function loadData() {
  try {
    const [flightsRes, routesRes, metaRes] = await Promise.all([
      fetch('./flight_stats.json'),
      fetch('./route_groups.json'),
      fetch('./meta.json'),
    ]);
    ALL_FLIGHTS = await flightsRes.json();
    ROUTE_GROUPS = await routesRes.json();
    try { META = await metaRes.json(); } catch (e) { META = null; }
    SEED_DATA = [...ALL_FLIGHTS]
      .filter(f => f.sampleSize >= 5)
      .sort((a, b) => b.sampleSize - a.sampleSize)
      .slice(0, 8);
    dataLoaded = true;
  } catch (e) {
    console.error('Failed to load flight data', e);
    dataLoadError = true;
  }
}

async function lookupFlight(flightNumberRaw) {
  const key = flightNumberRaw.replace(/\s+/g, '').toUpperCase();
  return ALL_FLIGHTS.find(f => f.flightNumber === key) || null;
}

function searchByDestination(query) {
  const needle = normalizeDestinationQuery(query);
  if (!needle) return { outbound: [], inbound: [], outboundTechStops: [], inboundTechStops: [] };
  const matchesOut = g => g.direction === 'departure' && g.destination.toLowerCase().includes(needle);
  const matchesIn = g => g.direction === 'arrival' && g.origin.toLowerCase().includes(needle);
  const byProb = (a, b) => a.delayProbability60 - b.delayProbability60;
  const outbound = ROUTE_GROUPS.filter(g => matchesOut(g) && !g.isTechnicalStop).sort(byProb);
  const inbound = ROUTE_GROUPS.filter(g => matchesIn(g) && !g.isTechnicalStop).sort(byProb);
  const outboundTechStops = ROUTE_GROUPS.filter(g => matchesOut(g) && g.isTechnicalStop);
  const inboundTechStops = ROUTE_GROUPS.filter(g => matchesIn(g) && g.isTechnicalStop);
  return { outbound, inbound, outboundTechStops, inboundTechStops };
}

function goHome() {
  view = 'home';
  currentFlight = null;
  render();
}

async function handleSearch(flightNumber, dir) {
  view = 'loading';
  render();
  await new Promise(r => setTimeout(r, 600));
  const result = await lookupFlight(flightNumber);
  if (result) {
    currentFlight = result;
    view = 'result';
  } else {
    view = 'notfound';
  }
  render();
}

function historyCard(recentFlights) {
  if (!recentFlights || recentFlights.length === 0) return '';
  const maxAbs = Math.max(...recentFlights.map(r => Math.abs(r.delayMin)), 60);
  const rows = recentFlights.map(r => {
    const late = r.delayMin >= 60;
    const widthPct = Math.max((Math.abs(r.delayMin) / maxAbs) * 100, 3);
    const sign = r.delayMin >= 0 ? '+' : '';
    return `
      <div style="display:flex;align-items:center;gap:12px;padding:7px 0">
        <span style="font-size:12px;color:var(--ink-faint);width:70px;flex-shrink:0">${r.date}</span>

          <div style="height:10px;border-radius:6px;width:${widthPct}%;background:${late ? 'var(--red)' : 'var(--green)'}"></div>

      </div>
    `;
  }).join('');
  return `
    <div class="card" style="cursor:pointer" onclick="showFlightDetailForCurrent()">
      <p class="why-title">היסטוריית טיסות אחרונה</p>
      ${rows}

        <div style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:var(--green)"></span><span style="font-size:12px;color:var(--ink-faint)">עד 60 דק' איחור</span></div>

function weightedSummary(groups) {
  const totalSamples = groups.reduce((s, g) => s + g.sampleSize, 0);
  if (totalSamples === 0) return null;
  const weightedRate = groups.reduce((s, g) => s + g.delayRate60 * g.sampleSize, 0) / totalSamples;
  return { rate: weightedRate, samples: totalSamples, flightCount: groups.length };
}

// Actual clock time isn't stored directly - it's derived from the
// group's representative scheduled time + that day's delay in minutes.
// Handles delays that push past midnight in either direction.
function addMinutesToTime(hhmm, delayMin) {
  const [h, m] = hhmm.split(':').map(Number);
  let total = h * 60 + m + Math.round(delayMin);
  let dayOffset = 0;
  while (total < 0) { total += 1440; dayOffset -= 1; }
  while (total >= 1440) { total -= 1440; dayOffset += 1; }
  const hh = String(Math.floor(total / 60)).padStart(2, '0');
  const mm = String(total % 60).padStart(2, '0');
  return { time: `${hh}:${mm}`, dayOffset };
}

    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <h3 style="margin:0">${airline}</h3>
      <button onclick="closeFlightDetail()" style="border:none;background:none;font-size:20px;color:var(--ink-faint);cursor:pointer;line-height:1">×</button>
    </div>
    <p style="font-size:12.5px;color:var(--ink-faint);margin:0 0 10px">${currentAirlineFlights.length} טיסות נותחו · לחצו על טיסה לפרטים נוספים</p>
    ${rows || `<p style="font-size:13px;color:var(--ink-soft)">לא נמצאו טיסות.</p>`}
  `;
  document.getElementById('flight-detail-modal').style.display = 'flex';
}

function showFlightDetail(dir, idx) {
  if (dir === 'yesterday') {
    renderSingleEventModal(META.mostDelayedYesterday[idx]);
    document.getElementById('flight-detail-modal').style.display = 'flex';
    return;
  }
  const group = dir === 'meta_delayed' ? META.mostDelayedFlights[idx]
    : dir === 'airline_list' ? currentAirlineFlights[idx]
    : destResults[dir][idx];
  renderFlightDetailModal(group);
  document.getElementById('flight-detail-modal').style.display = 'flex';
}

function renderSingleEventModal(e) {
  const primary = e.aliases[0];
  const actual = addMinutesToTime(e.scheduledTime, e.delayMin);
  const late = e.delayMin >= 60;
  document.getElementById('flight-detail-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <div>
        <h3 style="margin:0">${primary.airline} ${primary.flightNumber}</h3>
        <p style="margin:2px 0 0;font-size:13px;color:var(--ink-soft)">${e.origin} ← ${e.destination}</p>
      </div>
      <button onclick="closeFlightDetail()" style="border:none;background:none;font-size:20px;color:var(--ink-faint);cursor:pointer;line-height:1">×</button>
    </div>
    <div style="display:flex;gap:10px;font-size:11px;color:var(--ink-faint);padding:8px 0;border-bottom:1px solid var(--border);font-weight:600">
      <span style="width:70px">תאריך</span><span style="width:60px">מתוכנן</span><span style="width:80px">בפועל</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;font-size:13px">
      <span style="width:70px;color:var(--ink-faint)">${e.date}</span>
      <span style="width:60px">${e.scheduledTime}</span>
      <span style="width:80px;color:${late ? 'var(--red)' : 'var(--ink)'};font-weight:600">${actual.time}${actual.dayOffset ? ` (${actual.dayOffset>0?'+':''}${actual.dayOffset} יום)` : ''}</span>
      <span style="color:var(--ink-faint);margin-right:auto">${e.delayMin>=0?'+':''}${Math.round(e.delayMin)} min</span>
    </div>
    ${e.isCodeshareGroup ? `<p style="font-size:12px;color:var(--ink-faint);margin-top:10px">קודשרינג: גם ${e.aliases.slice(1).map(a=>`${a.airline} ${a.flightNumber}`).join(', ')}</p>` : ''}
  `;
}

function showFlightDetailForCurrent() {
  renderFlightDetailModal(currentFlight, true);
  document.getElementById('flight-detail-modal').style.display = 'flex';
}

function closeFlightDetail() {
  document.getElementById('flight-detail-modal').style.display = 'none';
}

function renderFlightDetailModal(f, isSingleFlight) {
  const primary = isSingleFlight ? { airline: f.airline, flightNumber: f.flightNumber } : f.aliases[0];
  const rows = (f.recentFlights || []).map(r => {
    const actual = addMinutesToTime(r.scheduledTime, r.delayMin);
    const late = r.delayMin >= 60;
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px">
        <span style="width:70px;color:var(--ink-faint)">${r.date}</span>
        <span style="width:60px">${r.scheduledTime}</span>
        <span style="width:80px;color:${late ? 'var(--red)' : 'var(--ink)'};font-weight:${late?600:400}">${actual.time}${actual.dayOffset ? ` (${actual.dayOffset>0?'+':''}${actual.dayOffset} יום)` : ''}</span>
        <span style="color:var(--ink-faint);margin-right:auto">${r.delayMin>=0?'+':''}${r.delayMin} min</span>
      </div>
    `;
  }).join('');
  document.getElementById('flight-detail-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <div>
        <h3 style="margin:0">${primary.airline} ${primary.flightNumber}</h3>
        <p style="margin:2px 0 0;font-size:13px;color:var(--ink-soft)">${f.origin} ← ${f.destination}</p>
      </div>
      <button onclick="closeFlightDetail()" style="border:none;background:none;font-size:20px;color:var(--ink-faint);cursor:pointer;line-height:1">×</button>
    </div>
    <div style="display:flex;gap:10px;font-size:11px;color:var(--ink-faint);padding:8px 0;border-bottom:1px solid var(--border);font-weight:600">
      <span style="width:70px">תאריך</span><span style="width:60px">מתוכנן</span><span style="width:80px">בפועל</span>
    </div>
    ${rows || `<p style="font-size:13px;color:var(--ink-soft)">אין עדיין נתוני היסטוריה זמינים לטיסה זו.</p>`}
  `;
}

function reviewsWidgetHTML(prefix, flightNumber) {
  return `
    <div class="card" id="${prefix}-reviews-section">
      <p class="why-title">ביקורות נוסעים</p>
      <div id="${prefix}-reviews-list"><p style="font-size:12.5px;color:var(--ink-faint)">טוען ביקורות...</p></div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft)">
        <p style="font-size:12px;color:var(--ink-faint);margin:0 0 8px">שתפו את החוויה שלכם בטיסה הזו — לא משנה מתי היא הייתה</p>
        <input id="${prefix}-review-date" type="date" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;margin-bottom:6px;background:var(--bg);color:var(--ink)" />
        <input id="${prefix}-review-name" type="text" placeholder="שם (אופציונלי)" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;margin-bottom:6px;background:var(--bg);color:var(--ink)" />
        <textarea id="${prefix}-review-text" placeholder="איך הייתה הטיסה?" rows="3" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:13px;margin-bottom:8px;background:var(--bg);color:var(--ink);resize:vertical"></textarea>
        <button id="${prefix}-review-submit-btn" onclick="submitReview('${flightNumber}', '${prefix}')" style="width:100%;background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer">שליחת ביקורת</button>
        <p id="${prefix}-review-status" style="font-size:12px;margin:6px 0 0"></p>
      </div>
    </div>
  `;
}

async function loadReviewsForFlight(flightNumber, prefix) {
  const listEl = document.getElementById(`${prefix}-reviews-list`);
  if (!listEl) return;
  if (GET_REVIEWS_URL.startsWith('REPLACE_')) {
    listEl.innerHTML = `<p style="font-size:12.5px;color:var(--ink-faint)">מערכת הביקורות עוד לא חוברה.</p>`;
    return;
  }
  try {
    const res = await fetch(`${GET_REVIEWS_URL}?flightNumber=${encodeURIComponent(flightNumber)}`);
    const reviews = await res.json();
    if (!Array.isArray(reviews) || reviews.length === 0) {
      listEl.innerHTML = `<p style="font-size:12.5px;color:var(--ink-faint)">אין עדיין ביקורות לטיסה הזו. היו הראשונים לכתוב!</p>`;
      return;
    }
    listEl.innerHTML = reviews.map(r => `
      <div style="padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px">
        <div style="display:flex;justify-content:space-between;color:var(--ink-faint);font-size:11.5px;margin-bottom:3px">
          <span>${r.reviewerName || 'אנונימי'}</span><span>${r.flightDate || ''}</span>
        </div>
        <div style="color:var(--ink-soft)">${(r.reviewText || '').replace(/</g,'&lt;')}</div>
      </div>
    `).join('');
  } catch (e) {
    listEl.innerHTML = `<p style="font-size:12.5px;color:var(--ink-faint)">לא הצלחנו לטעון ביקורות כרגע.</p>`;
  }
}

async function submitReview(flightNumber, prefix) {
  const btn = document.getElementById(`${prefix}-review-submit-btn`);
  const statusEl = document.getElementById(`${prefix}-review-status`);
  const date = document.getElementById(`${prefix}-review-date`).value;
  const name = document.getElementById(`${prefix}-review-name`).value.trim();
  const text = document.getElementById(`${prefix}-review-text`).value.trim();

  if (!text) { statusEl.textContent = 'נא לכתוב טקסט לביקורת.'; statusEl.style.color = 'var(--red)'; return; }
  if (text.length > 1000) { statusEl.textContent = 'הביקורת ארוכה מדי (מקסימום 1000 תווים).'; statusEl.style.color = 'var(--red)'; return; }
  if (SUBMIT_REVIEW_URL.startsWith('REPLACE_')) { statusEl.textContent = 'מערכת הביקורות עוד לא חוברה.'; statusEl.style.color = 'var(--red)'; return; }

  btn.disabled = true;
  btn.textContent = 'שולח...';
  try {
    await fetch(SUBMIT_REVIEW_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ flightNumber, flightDate: date, reviewerName: name, reviewText: text }),
    });
    statusEl.textContent = 'הביקורת נשלחה, תודה!';
    statusEl.style.color = 'var(--green)';
    document.getElementById(`${prefix}-review-text`).value = '';
    document.getElementById(`${prefix}-review-name`).value = '';
    loadReviewsForFlight(flightNumber, prefix);
  } catch (e) {
    statusEl.textContent = 'שליחת הביקורת נכשלה. נסו שוב.';
    statusEl.style.color = 'var(--red)';
  }
  btn.disabled = false;
  btn.textContent = 'שליחת ביקורת';
}

function summaryBlock(label, icon, summary, filterValue) {
  if (!summary) return '';
  const pct = Math.round(summary.rate * 100);
  const m = riskMeta(pct < 30 ? 'low' : pct < 60 ? 'medium' : 'high');
  const isActive = destDirectionFilter === filterValue;
  return `
    <div onclick="setDestFilter('${filterValue}')" style="flex:1;text-align:center;padding:16px 10px;border-radius:14px;background:var(--bg);cursor:pointer;border:2px solid ${isActive ? 'var(--brand)' : 'transparent'}">
      <div style="font-size:12px;color:var(--ink-faint);margin-bottom:6px">${icon} ${label}</div>
      <div style="font-size:32px;font-weight:700;color:var(${m.varFg})">${pct}%</div>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:4px">מ-${summary.flightCount} טיסות · ${summary.samples} תצפיות</div>
    </div>
  `;
}

function setDestFilter(value) {
  destDirectionFilter = destDirectionFilter === value ? 'both' : value;
  render();
}

function renderDestinationResult() {
  const { outbound, inbound, outboundTechStops, inboundTechStops } = destResults;
  const empty = outbound.length === 0 && inbound.length === 0;
  const showOut = destDirectionFilter === 'both' || destDirectionFilter === 'outbound';
  const showIn = destDirectionFilter === 'both' || destDirectionFilter === 'inbound';
  const hasTechStops = (showOut && outboundTechStops.length > 0) || (showIn && inboundTechStops.length > 0);
  const outSummary = weightedSummary(outbound);
  const inSummary = weightedSummary(inbound);
  return `
    <button class="back-btn" onclick="goHome()">→ חיפוש אחר</button>
    <div class="card" style="margin-top:14px">
      <div class="dest-title-row">
        <p class="why-title" style="margin:0">תוצאות עבור "${destQueryLabel}"</p>
      </div>
      ${!empty ? `
        <div style="display:flex;gap:10px;margin-top:14px">
          ${summaryBlock('לכיוון היעד', '🛫', outSummary, 'outbound')}
          ${summaryBlock('בחזרה לישראל', '🛬', inSummary, 'inbound')}
        </div>
        <p style="font-size:11.5px;color:var(--ink-faint);margin:10px 0 0;text-align:center">לחצו על אחת מהתיבות כדי לסנן רק לכיוון הזה</p>
      ` : ''}
    </div>
    <div class="card" style="margin-top:14px">
      <p class="dest-hint" style="margin-top:0">מדורגות מהכי אמינה להכי פחות אמינה, לפי אחוז הסיכוי לאיחור של 60+ דקות. דאטה אמיתי מהשבוע האחרון. טיסות המסומנות "קודשרינג" הן אותה טיסה פיזית הנמכרת תחת כמה מספרי/שמות חברות — לכן הן מוצגות כשורה אחת ולא כמה אפשרויות נפרדות.</p>
      ${empty && !hasTechStops ? `
        <p style="font-size:14px;color:var(--ink-soft);margin-top:18px">לא נמצאו טיסות ליעד הזה במדגם הנוכחי. נסו לכתוב את שם העיר באנגלית, או יעד אחר.</p>
      ` : `
        ${showOut && outbound.length ? `<div class="dest-section-title">🛫 טיסות ליעד (${outbound.length})</div>${outbound.map((f,i)=>rankRow(f,i+1,i===0,i===outbound.length-1 && outbound.length>1,'outbound',i)).join('')}` : ''}
        ${showIn && inbound.length ? `<div class="dest-section-title">🛬 טיסות חזרה (${inbound.length})</div>${inbound.map((f,i)=>rankRow(f,i+1,i===0,i===inbound.length-1 && inbound.length>1,'inbound',i)).join('')}` : ''}
      `}
    </div>
    ${hasTechStops ? `
    <div class="card" style="margin-top:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <p class="why-title" style="margin:0">✈️🔄 עצירות ביניים ב${destQueryLabel} (${(showOut?outboundTechStops.length:0) + (showIn?inboundTechStops.length:0)})</p>
      </div>
      <p class="dest-hint" style="margin-top:0">הטיסות האלה <strong>עוצרות</strong> ב${destQueryLabel} לצורך החלפת צוות אווירי (בשל המצב הביטחוני), אך לא זהו יעדן הסופי — הנוסעים ממשיכים איתן ליעד אחר. אין לנו נתוני עיכוב עבור המשך הדרך, ולכן הן לא כלולות בדירוג למעלה.</p>
      ${[...(showOut?outboundTechStops:[]), ...(showIn?inboundTechStops:[])].map(g => `
        <div style="padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13px">
          <div style="font-weight:500">${g.aliases[0].airline} ${g.aliases[0].flightNumber}${g.aliases.length>1 ? ` (גם ${g.aliases.slice(1).map(a=>a.flightNumber).join(', ')})` : ''}</div>
          <div style="color:var(--ink-soft);margin-top:2px">${g.origin} ← ${g.destination} · ${g.technicalStopNote}</div>
        </div>
      `).join('')}
    </div>
    ` : ''}
    <div class="card trust-box">
      <p>הדירוג מבוסס על נתונים היסטוריים אמיתיים מהשבוע האחרון בלבד. עם עוד דאטה, הדירוג יהיה מדויק יותר.</p>
    </div>
  `;
}

function render() {
  const app = document.getElementById('app');
  if (view === 'home') app.innerHTML = renderHome();
  else if (view === 'loading') app.innerHTML = renderLoading();
  else if (view === 'notfound') app.innerHTML = renderNotFound();
  else if (view === 'result') {
    app.innerHTML = renderResult(currentFlight);
    loadReviewsForFlight(currentFlight.flightNumber, 'page');
  }
  else if (view === 'destresult') app.innerHTML = renderDestinationResult();
}

function setDirection(d) { direction = d; render(); }
function setSearchMode(m) { searchMode = m; render(); }
function submitSearch() {
  const v = document.getElementById('input-flight').value;
  if (!v.trim()) return;
  handleSearch(v, direction);
}
function submitDestSearch() {
  const v = document.getElementById('input-dest').value;
  if (!v.trim()) return;
  destQueryLabel = v.trim();
  destResults = searchByDestination(v);
  destDirectionFilter = 'both';
  view = 'destresult';
  render();
}
function quickDestSearch(city) {
  destQueryLabel = city;
  destResults = searchByDestination(city);
  destDirectionFilter = 'both';
  view = 'destresult';
  render();
}
function quickSearch(flightNumber, dir) {
  direction = dir;
  handleSearch(flightNumber, dir);
}

(async function boot() {
  document.getElementById('app').innerHTML = `
    <div class="loading"><div class="spinner"></div>Loading flight data...</div>
  `;
  await loadData();
  if (dataLoadError) {
    document.getElementById('app').innerHTML = `
      <div class="not-found">
        <p style="font-size:15px;color:var(--ink-soft)">Couldn't load flight data. Make sure flight_stats.json and route_groups.json are in the same folder as this page.</p>
      </div>
    `;
    return;
  }
  render();
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
